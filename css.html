<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>STYLING></title>
        <style>
            .box{
                background-color: aquamarine;
            }
            h1{
                color:brown;
                text-transform: uppercase;
                text-align: center;
                text-decoration: underline dotted;
                line-height: 50px;
                word-spacing: normal;
                letter-spacing: normal;
                text-shadow: 11px 11px 15px black;
            }
        </style>
    </head>
    <body>
        <div class="box" style="background-color:antiquewhite; width: auto; height: auto;">
            <h1>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </h1>
        </div>
    </body>
