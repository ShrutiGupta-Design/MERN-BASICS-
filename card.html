<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
    }
    .maincontainer{
        border: 2px solid white;
        height: 100vh;
        width:80vw;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .card{
        border: 2px solid lightblue;
        height: 100%;
        width: 50%;
        background-color: lightblue;
        border-radius: 10px;
    }
    .card1{
        border: 2px solid lightblue;
        background-color:lightblue;
        display: flex;
        justify-content: center;
        align-items:center;
        border-radius: 10px;
    }
    .content{
        border: 2px solid lightblue;
        width: 60%;
        background-color:lightblue;
        display: flex;
        justify-content: center;
        align-items:center;
        flex-direction: column;
        border-radius: 10px;
    }
    button{
        align-items: center;
        border: 2px solid black;
        background-color: yellow;
        height: 50px;
        width: 200px;
        font-size: 20px;
        border-radius: 10px;
    }
    p{
        font-size: 20px;
    }
    </style>
<body>
    <div class="maincontainer">
        <div class="card">
            <div class="card1">
            <img src="https://www.portronics.com/cdn/shop/files/portronics_muffs_m8_over_ear_hybrid_anc_bluetooth_headphone.jpg?v=1774435529 "alt="head phone" width="650px" height="400px" border-radius="20px">
            </div>
            <div class="content">
                <h1><b> Wireless Headphones </b></h1> <br>
                <h2> Price: $99.99 </h2><br>
                <p style="align-content: centre;"> <i> Experience the freedom of wireless audio with our premium headphones. Enjoy crystal-clear sound, long battery life, and a comfortable fit for all-day listening. Perfect for music lovers and on-the-go lifestyles.</i> </p> <br>
                <button> ADD TO CART </button>
            </div>
        </div>
    </div>
</body>
</html>
